<title>SCS Work Permit - PT TJ Forge Indonesia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F5F7FB; --surface:#FFFFFF; --surface2:#F5F8FC; --ink:#142132; --muted:#5F7086; --line:#E1E7EF;
  --navy:#142132; --navy2:#23374d; --accent:#FF8200; --accent-ink:#FFFFFF; --blue:#1A6FD4;
  --ok:#157A3E; --ok-bg:#DDF3E5; --warn:#8A5A00; --warn-bg:#FFF0CC; --bad:#B42318; --bad-bg:#FDE4E1; --info:#1A56A8; --info-bg:#DFEBFB; --neutral-bg:#E6EBF2;
  --font:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
#app.page{max-width:1080px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h2{font-size:18px}h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
body.busy::before{content:"";position:fixed;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,var(--accent),var(--blue));z-index:50;animation:bar 1s linear infinite}
@keyframes bar{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.seg{display:flex;background:var(--neutral-bg);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap;width:max-content;max-width:100%}
.seg button{border:0;background:transparent;color:var(--ink);padding:7px 14px;border-radius:8px;font-weight:500;font-size:13px}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff;font-weight:600}
.who{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin:18px 0 14px}
.who p{margin:0;color:var(--muted)}
.lock{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);background:var(--neutral-bg);padding:5px 10px;border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;width:100%}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{color:var(--muted);font-size:12.5px}
button.stat[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel+.panel{margin-top:14px}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface2)}
.row .no{font-family:var(--mono);font-size:12.5px;color:var(--muted);min-width:130px}
.row .main{flex:1 1 220px;min-width:0}
.row .main b{display:block;overflow-wrap:anywhere}
.row .main small{color:var(--muted)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11.5px;background:var(--neutral-bg);color:var(--ink);padding:2px 8px;border-radius:999px}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.s-Diajukan{background:var(--warn-bg);color:var(--warn)}
.s-Diketahui{background:var(--info-bg);color:var(--info)}
.s-Dikembalikan{background:var(--neutral-bg);color:var(--muted)}
.s-Disetujui{background:var(--ok-bg);color:var(--ok)}
.s-Aktif{background:var(--ok);color:var(--surface)}
.s-Selesai{background:var(--neutral-bg);color:var(--ink)}
.s-Ditolak,.s-Kedaluwarsa{background:var(--bad-bg);color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:9px;font-weight:600;text-decoration:none;color:var(--ink);display:inline-block}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 12px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea,.cell{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-weight:400;font-size:14px;min-width:0;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid .wide{grid-column:1/-1}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.steps span{font-size:12.5px;padding:5px 12px;border-radius:999px;background:var(--neutral-bg);color:var(--muted);font-weight:500}
.steps span.on{background:var(--navy);color:#fff}
.steps span.done{background:var(--ok-bg);color:var(--ok)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:13.5px}
th{background:var(--surface2);text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;color:var(--muted);width:34px}
.typepick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.typepick label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);cursor:pointer}
.typepick label:has(input:checked){border-color:var(--accent);background:var(--surface2);box-shadow:inset 0 0 0 1px var(--accent)}
.typepick small{display:block;color:var(--muted);font-weight:400}
.chk{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.yn{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.yn button{border:0;background:var(--surface);padding:5px 12px;font-weight:600;font-size:12.5px;color:var(--muted)}
.yn button[aria-pressed=true].y{background:var(--ok);color:var(--surface)}
.yn button[aria-pressed=true].t{background:var(--neutral-bg);color:var(--ink)}
.apd{display:flex;flex-wrap:wrap;gap:6px}
.apd label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;background:var(--surface);cursor:pointer}
.apd label:has(input:checked){background:var(--info-bg);border-color:var(--blue);color:var(--info)}
.draft{background:var(--warn-bg);color:var(--warn);font-size:12.5px;padding:6px 10px;border-radius:8px;margin:0 0 8px}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 20px;margin:0}
.dl div{min-width:0}.dl dt{font-size:12px;color:var(--muted)}.dl dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px;padding:0}
.flow li{list-style:none;font-size:12.5px;padding:6px 12px;border-radius:8px;background:var(--neutral-bg);color:var(--muted)}
.flow li.done{background:var(--ok-bg);color:var(--ok);font-weight:600}
.flow li.cur{background:var(--navy);color:#fff;font-weight:600}
.log{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.log li{display:grid;grid-template-columns:150px 1fr;gap:8px;font-size:13px}
.log time{font-family:var(--mono);font-size:12px;color:var(--muted)}
.gasok{color:var(--ok);font-weight:600}.gasbad{color:var(--bad);font-weight:700}
.note{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--bad);margin-top:8px}
.back{background:none;border:0;color:var(--blue);padding:0;font-weight:600;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;z-index:60;max-width:90vw}
.success{border:1px solid var(--ok);background:var(--ok-bg);color:var(--ok);padding:16px;border-radius:12px}
.success .big{font-family:var(--mono);font-size:22px;font-weight:600;overflow-wrap:anywhere}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:18px}
.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;text-decoration:none;color:var(--ink)}
.card:hover{border-color:var(--accent)}
.card h3{font-size:17px;margin-bottom:6px}.card p{margin:0;color:var(--muted)}
.card.accent{background:var(--navy);color:#fff;border-color:var(--navy)}.card.accent p{color:#B7C6DC}
.loginbox{max-width:420px;margin:28px auto 0}
.fbar{margin-bottom:14px}.fbar .grid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.fbar .grid .wide{grid-column:1/-1}
canvas.pad{width:100%;max-width:360px;height:120px;border:1px dashed var(--muted);border-radius:8px;background:#fff;touch-action:none;display:block}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
/* QR */
.qrbox{background:#fff;padding:6px;border-radius:6px;display:inline-block;line-height:0}
.qrbox svg{width:100%;height:auto;shape-rendering:crispEdges}
.poster{background:#fff;color:#000;border:1px solid var(--line);border-radius:10px;padding:28px;max-width:794px;margin:0 auto;text-align:center}
.poster h1{font-size:22px;margin-bottom:2px}.poster .sub{color:#333;margin-bottom:18px}
.poster .two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.poster .two>div{border:2px solid #0B2545;border-radius:12px;padding:16px}
.poster h2{font-size:17px;margin-bottom:4px;color:#000}.poster p{margin:4px 0;color:#222;font-size:13px}
.poster .qrbox{width:100%;max-width:260px;padding:8px;border:1px solid #ccc}
.poster .url{font-family:var(--mono);font-size:11px;overflow-wrap:anywhere;color:#333}
@media(max-width:560px){.poster .two{grid-template-columns:1fr}}
/* lembar izin (cetak / PDF) */
.sheet{background:#fff;color:#000;border:1px solid var(--line);border-radius:6px;padding:26px;max-width:794px;margin:0 auto;font:12px/1.45 var(--font)}
.sheet h1{font-size:16px;text-align:center;letter-spacing:.5px}
.sheet .sub{text-align:center;font-size:11px;color:#333;margin-bottom:8px}
.sheet .mono{font-family:var(--mono)}
.sheet .sh-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 16px;border-top:2px solid #0B2545;border-bottom:1px solid #999;padding:6px 0;margin-bottom:4px}
.sheet .sh-info{display:grid;gap:2px}
.sheet .sh-qr{text-align:center;font-size:9.5px;color:#333;line-height:1.3}
.sheet .sh-qr .qrbox{width:84px;padding:0}
.sheet h3{font-size:12px;margin:12px 0 4px;background:#0B2545;color:#fff;padding:3px 8px}
.sheet table{min-width:0;font-size:11px;width:100%}
.sheet th{background:#eee;color:#000;border:1px solid #999;padding:3px 5px;font-size:11px}
.sheet td{border:1px solid #999;padding:3px 5px;color:#000}
.sheet .dl{grid-template-columns:1fr 1fr;gap:3px 16px}
.sheet .dl dt{color:#444;font-size:10.5px}.sheet .dl dd{font-size:11.5px}
.sheet .sh-note{font-size:10.5px;color:#444;margin:2px 0}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;break-inside:avoid}
.sig{border:1px solid #999;padding:10px;min-height:150px;font-size:11px}
.sig .role{font-weight:600}
.dsig{border:1.5px solid #157A3E;border-radius:6px;padding:6px 8px;color:#0f5a2c;margin-top:8px;font-size:10.5px;background:#f2fbf5}
.sigrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.sigrow img{height:56px;max-width:170px;object-fit:contain}
.stamp{display:inline-flex;flex-direction:column;align-items:center;text-align:center;border:2px solid #1A56A8;color:#1A56A8;border-radius:8px;padding:4px 10px;transform:rotate(-4deg);font-size:9.5px;line-height:1.3}
.stamp b{font-size:13px;letter-spacing:1px}
/* ===== Tampilan gaya SCS ===== */
.container{width:min(1200px,calc(100% - 40px));margin-inline:auto}
.topline{height:4px;background:linear-gradient(90deg,#FF8200 0 26%,#142132 26% 100%)}
.site-header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid #E4E9F0}
.header-inner{min-height:84px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand-side{display:flex;align-items:center;gap:18px;min-width:0}
.company-logo{width:170px;height:auto;display:block;flex:none}
.hd-divider{width:1px;height:42px;background:#DBE3EC;flex:none}
.scs-brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--navy)}
.scs-mark{width:52px;height:52px;flex:none;object-fit:contain}
.scs-wording{font-weight:850;line-height:1.05;letter-spacing:-.03em;font-size:15px}
.main-nav{display:flex;align-items:center;gap:28px}
.main-nav a{font-size:14px;font-weight:650;color:#405066;position:relative;padding:8px 0;text-decoration:none}
.main-nav a:hover,.main-nav a.active{color:var(--navy)}
.main-nav a.active::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:3px;background:var(--accent);border-radius:999px}
.main-nav .only-m{display:none}
.header-actions{display:flex;align-items:center;gap:12px}
.hbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:14px;padding:14px 22px;font-weight:750;font-size:14.5px;cursor:pointer;transition:.2s ease;white-space:nowrap;text-decoration:none}
.hbtn:hover{transform:translateY(-2px)}
.hbtn-primary{background:var(--accent);color:#fff;box-shadow:0 14px 28px rgba(255,130,0,.22)}
.hbtn-primary:hover{background:#F67600}
.hbtn-secondary{background:#fff;color:var(--navy);border:1px solid #CDD6DF;box-shadow:0 8px 24px rgba(20,33,50,.05)}
.hbtn-sm{padding:11px 18px;border-radius:12px}
.hbtn svg{width:18px;height:18px;flex:none}
.hd-user{font-size:13px;color:#405066;text-align:right;line-height:1.3}
.hd-user b{display:block;color:var(--navy)}
.menu-toggle{display:none;border:1px solid #D8E0E8;background:#fff;border-radius:12px;width:46px;height:46px;align-items:center;justify-content:center;cursor:pointer}
.menu-toggle svg{width:24px;height:24px}
.lp-hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#F9FBFD 0%,#F5F7FB 100%)}
.lp-hero-inner{display:grid;grid-template-columns:1.02fr .98fr;align-items:center;gap:34px;padding:56px 0 52px}
.lp-eyebrow{font-size:16px;font-weight:760;color:#30445B}
.lp-eyebrow .tj{color:var(--accent);font-weight:900}
.lp-hero h1{margin:16px 0 18px;font-size:clamp(46px,6vw,76px);line-height:1.02;letter-spacing:-.055em;font-weight:850}
.lp-bar{width:84px;height:5px;border-radius:999px;background:var(--accent);margin:0 0 24px}
.lp-lead{margin:0;max-width:560px;font-size:18px;line-height:1.75;color:#58697D}
.lp-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:32px}
.lp-proof{display:flex;align-items:flex-start;gap:10px;margin-top:26px;color:#627489;font-size:14px;font-weight:650}
.lp-proof svg{width:18px;height:18px;color:var(--accent);flex:none;margin-top:2px}
.lp-visual{position:relative;min-height:470px;display:flex}
.lp-frame{position:absolute;inset:0;clip-path:polygon(16% 0,100% 0,100% 100%,0 100%,0 18%);background:linear-gradient(145deg,#FF8200,#FF9F1A);box-shadow:0 18px 45px rgba(20,33,50,.10)}
.lp-photo{position:relative;z-index:1;width:100%;clip-path:polygon(17% 0,100% 0,100% 100%,0 100%,0 18%);overflow:hidden}
.lp-photo img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.lp-badge{position:absolute;right:20px;bottom:20px;z-index:2;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.95);padding:14px 18px;border-radius:16px;box-shadow:0 15px 40px rgba(20,33,50,.18);font-size:14px;font-weight:800}
.lp-badge svg{width:22px;height:22px;color:var(--accent)}
.lp-strip{position:relative;margin-top:-22px;padding-bottom:10px}
.lp-grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.lp-fcard{background:#fff;border:1px solid #EDF1F5;border-radius:22px;box-shadow:0 14px 34px rgba(20,33,50,.08);padding:24px 12px;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;text-decoration:none;color:var(--navy);transition:.2s ease}
.lp-fcard:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(20,33,50,.12);border-color:#FFD09A}
.lp-fcard svg{width:46px;height:46px}
.lp-fcard h3{margin:0;font-size:14px;line-height:1.45;font-weight:700}
.lp-fcard small{display:block;font-size:11.5px;font-weight:500;color:#66778D;margin-top:2px}
.lp-section{padding:76px 0}
.lp-soft{background:#fff;border-top:1px solid #E4E9F0}
.lp-kicker{display:inline-flex;align-items:center;gap:8px;color:var(--accent);text-transform:uppercase;letter-spacing:.15em;font-size:12px;font-weight:850;margin-bottom:14px}
.lp-kicker::before{content:"";width:22px;height:2px;background:currentColor;border-radius:999px}
.lp-title{margin:0 0 14px;font-size:clamp(28px,3.6vw,42px);line-height:1.1;letter-spacing:-.045em;font-weight:850;max-width:820px}
.lp-sub{margin:0;color:#66778D;font-size:16px;line-height:1.75;max-width:720px}
.lp-cards{display:grid;gap:20px;margin-top:32px}
.lp-cards.c4{grid-template-columns:repeat(4,1fr)}
.lp-cards.c3{grid-template-columns:repeat(3,1fr)}
.lp-card{background:#fff;border:1px solid #E7EDF3;border-radius:22px;padding:26px;box-shadow:0 8px 24px rgba(20,33,50,.05);text-decoration:none;color:var(--navy);display:block;position:relative}
a.lp-card{transition:.2s ease}
a.lp-card:hover{transform:translateY(-4px);border-color:#FFD09A;box-shadow:0 16px 36px rgba(20,33,50,.10)}
.lp-card .no{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--accent);color:#fff;font-weight:850;font-size:16px;margin-bottom:14px}
.lp-card svg.ic{width:42px;height:42px;margin-bottom:14px}
.lp-card h3{margin:0 0 8px;font-size:18px;font-weight:750}
.lp-card p{margin:0;color:#607185;line-height:1.65;font-size:14.5px}
.lp-card .go svg{width:18px;height:18px}
.lp-card .go{white-space:nowrap;display:inline-flex;gap:6px;align-items:center;margin-top:14px;font-weight:750;color:var(--accent);font-size:14px}
.lp-foot{background:#101B29;color:#DFE6EE;padding:30px 0 24px;margin-top:0}
.lp-foot .row2{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}
.lp-foot img{width:190px;background:#fff;border-radius:12px;padding:10px;display:block}
.lp-foot .fb{display:flex;align-items:center;gap:16px}
.lp-foot .fn{font-size:14px;color:#ADC0D4}
@media(max-width:1100px){.lp-grid6{grid-template-columns:repeat(3,1fr)}.lp-hero-inner{grid-template-columns:1fr}.lp-visual{min-height:420px}.lp-cards.c4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
 .header-inner{min-height:74px}.company-logo{width:140px}.hd-divider{display:none}.scs-wording{font-size:12px}
 .main-nav{display:none;position:absolute;left:14px;right:14px;top:80px;background:#fff;border:1px solid #E6EDF4;border-radius:18px;padding:16px 18px;box-shadow:0 18px 40px rgba(20,33,50,.12);flex-direction:column;align-items:flex-start;gap:6px}
 .main-nav.open{display:flex}
 .main-nav a.active::after{bottom:0}
 .main-nav .only-m{display:block}
 .main-nav .navbtn{border:0;background:none;padding:8px 0;font-weight:650;font-size:14px;color:#B42318;text-align:left}
 .menu-toggle{display:flex}
 .header-actions .hbtn,.header-actions .hd-user{display:none}
 .lp-hero-inner{padding:28px 0 24px;gap:24px}
 .lp-lead{font-size:16.5px}.lp-visual{min-height:340px}
 .lp-cards.c3{grid-template-columns:1fr}.lp-section{padding:58px 0}
}
@media(max-width:560px){
 .company-logo{width:120px}.scs-mark{width:38px;height:38px}.scs-wording{font-size:9.5px}
 .lp-actions{flex-direction:column;align-items:stretch}.lp-actions .hbtn{width:100%}
 .lp-visual{min-height:290px}.lp-badge{left:14px;right:14px;bottom:14px;justify-content:center;font-size:13px;padding:12px 14px}
 .lp-grid6{grid-template-columns:1fr 1fr;gap:12px}.lp-fcard{min-height:140px;padding:18px 8px}.lp-fcard h3{font-size:13px}
 .lp-cards.c4{grid-template-columns:1fr}.lp-foot .fb{flex-direction:column;align-items:flex-start}
}
@media(max-width:560px){.log li{grid-template-columns:1fr}.row .no{min-width:0}.sigs{grid-template-columns:1fr}.sheet{padding:14px}}
@media(prefers-reduced-motion:no-preference){.panel{animation:in .18s ease-out}@keyframes in{from{opacity:.6;transform:translateY(3px)}}}
@media print{.topline,.site-header,.lp-foot,.noprint,.toast{display:none!important}#app.page{padding:0;max-width:none}.poster{border:0;padding:0}body{background:#fff;padding:0}body.busy::before{display:none}.sheet{border:0;border-radius:0;padding:0;max-width:none}h3,.sheet th,.stamp,.dsig{-webkit-print-color-adjust:exact;print-color-adjust:exact}table{break-inside:auto}tr{break-inside:avoid}@page{size:A4;margin:12mm}}
</style>

const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const $=s=>document.querySelector(s);
const app=$('#app'),top_=$('#top');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayJ=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Jakarta'});
const addDays=n=>{const d=new Date(todayJ()+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const fmt=s=>s?new Date(s+'T00:00:00Z').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'}):'-';
const fmtDT=s=>{if(!s)return '-';const d=new Date(s);return isNaN(d)?esc(s):d.toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jakarta'})};
const apiUrl=()=>ls.get('wp-api')||API_URL;
const baseUrl=()=>location.href.split('#')[0];
function qrSvg(text){
 try{const q=qrcode(0,'M');q.addData(text);q.make();return `<span class="qrbox">${q.createSvgTag(4,0).replace('<svg ','<svg class="qr" role="img" aria-label="Kode QR" ')}</span>`}
 catch(e){return '<span class="note">QR tidak dapat dibuat.</span>'}
}
let toastT;
function toast(m){clearTimeout(toastT);let e=$('.toast');if(!e){e=document.createElement('div');e.className='toast';e.setAttribute('role','status');document.body.appendChild(e)}e.textContent=m;toastT=setTimeout(()=>e.remove(),3200)}
const pill=s=>`<span class="pill s-${esc(s)}">${esc(s)}</span>`;
const getPath=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);

/* ===== Jaringan ===== */
const S={token:ls.get('wp-token')||'',user:null,list:[],cur:null};
try{S.user=JSON.parse(ls.get('wp-user')||'null')}catch(e){}
let busyN=0;
const busy=d=>{busyN+=d;document.body.classList.toggle('busy',busyN>0)};
async function api(action,data,auth){
 const payload=Object.assign({action},data||{});
 if(auth!==false&&S.token)payload.token=S.token;
 const url=apiUrl();
 if(!url||url.indexOf('GANTI')===0)throw new Error('Alamat server belum diatur. Hubungi HSE.');
 busy(1);let j;
 try{
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  j=await r.json();
 }catch(e){busy(-1);throw new Error('Tidak dapat terhubung ke server. Periksa koneksi internet atau alamat server.')}
 busy(-1);
 if(!j.ok){
  if(j.code==='AUTH'&&S.token)logout(true);
  const er=new Error(j.error||'Terjadi kesalahan.');er.code=j.code;throw er;
 }
 return j;
}
function logout(expired){
 S.token='';S.user=null;ls.del('wp-token');ls.del('wp-user');
 if(expired)toast('Sesi berakhir. Silakan login kembali.');
 location.hash='#/login';
}

let current=()=>{};
function rerender(){
 const a=document.activeElement;const id=a&&a.id;const pos=a&&a.selectionStart;
 current();
 if(id){const n=document.getElementById(id);if(n){n.focus();try{if(pos!=null)n.setSelectionRange(pos,pos)}catch(e){}}}
}

}
async function route(){
 const parts=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean).map(decodeURIComponent);
 renderTop();window.scrollTo(0,0);
 app.className=(!parts.length||!['ajukan','status','lembar','login','app'].includes(parts[0]))?'':'page';
 try{
  if(!parts.length)return await home();
  if(parts[0]==='ajukan')return await pageAjukan();
  if(parts[0]==='status')return await pageStatus(parts[1]);
  if(parts[0]==='lembar')return await pageLembarPublik(parts[1]);
  if(parts[0]==='login')return await pageLogin();
  if(parts[0]==='app')return await pageApp(parts.slice(1));
  await home();
 }catch(e){showError(e)}
}

const newDraft=()=>({general:{kontraktor:'',alamat:'',judul:'',lokasi:'',plant:'',dept:'',picTjfi:'',telpTjfi:'',picKon:'',telpKon:'',pengawasKon:'',telpPengawas:'',jumlah:'',mulai:addDays(1),selesai:addDays(1),keterangan:''},workers:[{nama:'',unit:'',idn:''},{nama:'',unit:'',idn:''},{nama:'',unit:'',idn:''}],types:[],checks:{},apd:{},desc:{},jsea:[{tahap:'',pic:'',bahaya:'',kendali:'',lingk:'',kendaliLing:''}]});
let wiz=null,wstep=0,wizErr='',wizDone=null,draftT;
const STEPS=['Data kerja','Pekerja','Jenis izin','JSEA','Kirim'];
function loadDraft(){
 try{const d=JSON.parse(ls.get('wp-draft')||'null');if(d&&d.wiz&&d.wiz.general){wiz=d.wiz;wstep=Math.min(+d.wstep||0,4);if(wiz.general.mulai<todayJ())wiz.general.mulai=addDays(1);if(wiz.general.selesai<wiz.general.mulai)wiz.general.selesai=wiz.general.mulai;return}}catch(e){}
 wiz=newDraft();wstep=0;
}
const saveDraft=()=>{clearTimeout(draftT);draftT=setTimeout(()=>ls.set('wp-draft',JSON.stringify({wiz,wstep})),300)};
function pageAjukan(){
 if(!wiz)loadDraft();
 wizDone=null;wizErr='';
 draw(()=>{
  if(wizDone){app.innerHTML=`<div class="who"><div><h2>Pengajuan izin kerja kontraktor</h2></div></div><div class="success"><div>Permit terkirim. Simpan nomor ini untuk mengecek status:</div><div class="big">${esc(wizDone)}</div><div class="note" style="color:inherit;margin-top:6px">Status berikutnya: menunggu Dept. ${esc(wizDone_dept)} mengetahui, lalu HSE menyetujui. Pekerjaan baru boleh dimulai setelah status Disetujui dan sesuai tanggal izin.</div></div><div class="actions"><a class="btn primary" href="#/status/${encodeURIComponent(wizDone)}">Lihat status</a><button class="btn" data-act="again">Ajukan permit lain</button></div>`;return}
  const st=`<div class="steps">${STEPS.map((s,i)=>`<span class="${i===wstep?'on':i<wstep?'done':''}">${i+1}. ${s}</span>`).join('')}</div>`;
  const body=[stepGeneral,stepWorkers,stepTypes,stepJsea,stepReview][wstep]();
  const nav=`<div class="actions">${wstep>0?'<button class="btn" data-act="wprev">Kembali</button>':''}${wstep<4?'<button class="btn primary" data-act="wnext">Lanjut</button>':'<button class="btn primary" data-act="wsend">Kirim permit</button>'}</div><div class="err" role="alert">${esc(wizErr)}</div>`;
  app.innerHTML=`<div class="who"><div><h2>Pengajuan izin kerja kontraktor</h2><p>Tanpa login. Isi data, lalu kirim untuk diketahui departemen dan disetujui HSE. Isian tersimpan otomatis di perangkat ini.</p></div></div>${st}<div class="panel">${body}${nav}</div>`;
 });
}
let wizDone_dept='';
const bi=(ctx,path,label,type,cls,extra)=>`<label class="f ${cls||''}">${label}<input id="${ctx}-${path.replace(/\./g,'-')}" data-ctx="${ctx}" data-bind="${path}" type="${type||'text'}" ${extra||''} value="${esc(getPath(ctx==='wiz'?wiz:{},path))}"></label>`;
const wi=(path,label,type,cls,extra)=>bi('wiz',path,label,type,cls,extra);
function stepGeneral(){const g=wiz.general;return `<h3 style="margin-bottom:12px">Data kerja</h3><div class="grid">
 ${wi('general.kontraktor','Nama kontraktor')}${wi('general.alamat','Alamat kantor')}
 ${wi('general.judul','Judul kerja','text','wide')}
 ${wi('general.lokasi','Lokasi kerja (area / bangunan)')}
 <label class="f">Plant tempat pekerjaan<select id="wiz-plant" data-ctx="wiz" data-bind="general.plant"><option value="">Pilih plant</option>${PLANTS.map(d=>`<option ${g.plant===d?'selected':''}>${d}</option>`).join('')}</select></label>
 <label class="f">Dept. pemberi kerja<select id="wiz-dept" data-ctx="wiz" data-bind="general.dept"><option value="">Pilih departemen</option>${DEPTS.map(d=>`<option ${g.dept===d?'selected':''}>${d}</option>`).join('')}</select></label>
 ${wi('general.picTjfi','PIC PT TJFI')}${wi('general.telpTjfi','Telepon PIC TJFI','tel')}
 ${wi('general.picKon','PIC kontraktor')}${wi('general.telpKon','Telepon PIC kontraktor','tel')}
 ${wi('general.pengawasKon','Pengawas K3 kontraktor')}${wi('general.telpPengawas','Telepon pengawas K3','tel')}
 ${wi('general.jumlah','Jumlah pekerja','number','','min="1" max="500"')}
 ${wi('general.mulai','Tanggal mulai','date')}${wi('general.selesai','Tanggal selesai','date')}
 <label class="f wide">Keterangan pekerjaan<textarea id="wiz-ket" data-ctx="wiz" data-bind="general.keterangan" rows="3">${esc(g.keterangan)}</textarea></label></div>`}
function stepWorkers(){return `<h3>Daftar pekerja</h3><p class="note" style="margin:4px 0 12px">Nomor identitas diisi KTP atau SIM. Pekerja wajib membawa identitas dan memakai kartu pengenal serta seragam di area TJFI.</p>
 <div class="tablewrap"><table><thead><tr><th>No</th><th>Nama</th><th>Unit kerja</th><th>No. identitas</th></tr></thead><tbody>${wiz.workers.map((w,i)=>`<tr><td class="n">${i+1}</td>${['nama','unit','idn'].map(k=>`<td><input class="cell" id="wk-${i}-${k}" data-ctx="wiz" data-bind="workers.${i}.${k}" value="${esc(w[k])}" aria-label="${k} pekerja ${i+1}"></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="actions"><button class="btn ghost" data-act="addw">Tambah pekerja</button></div>`}
function stepTypes(){
 const pick=Object.entries(TYPES).map(([k,t])=>`<label><input type="checkbox" data-chk="type" data-k="${k}" ${wiz.types.includes(k)?'checked':''}><span><b>${t.nama}</b><small>${t.sub}</small></span></label>`).join('');
 return `<h3>Jenis izin khusus</h3><p class="note" style="margin:4px 0 12px">Centang semua yang diperlukan. Bisa lebih dari satu untuk satu pekerjaan.</p><div class="typepick">${pick}</div>${wiz.types.map(k=>typeSection(k,wiz,true)).join('')}`}
function typeSection(k,p,edit){
 const t=TYPES[k];const ck=(p.checks&&p.checks[k])||t.items.map(()=>'');const ap=(p.apd&&p.apd[k])||[];
 return `<section style="margin-top:20px"><h3>${t.nama}</h3>${t.draft?'<p class="draft">Draf: isi checklist ini sedang menunggu konfirmasi HSE.</p>':''}
 ${edit?`<label class="f" style="margin:8px 0">Uraian pekerjaan<textarea id="desc-${k}" data-ctx="wiz" data-bind="desc.${k}" rows="2">${esc((p.desc&&p.desc[k])||'')}</textarea></label>`:`<p class="note">${esc((p.desc&&p.desc[k])||'')}</p>`}
 <div>${t.items.map((it,i)=>`<div class="chk"><span>${i+1}. ${esc(it)}</span>${edit?`<span class="yn"><button class="y" data-act="ck" data-k="${k}" data-i="${i}" data-v="y" aria-pressed="${ck[i]==='y'}">Ya</button><button class="t" data-act="ck" data-k="${k}" data-i="${i}" data-v="t" aria-pressed="${ck[i]==='t'}">T/A</button></span>`:`<span class="pill ${ck[i]==='y'?'s-Disetujui':'s-Dikembalikan'}">${ck[i]==='y'?'Ya':ck[i]==='t'?'T/A':'-'}</span>`}</div>`).join('')}</div>
 <div style="margin-top:10px"><div class="note" style="margin-bottom:6px">APD yang digunakan</div><div class="apd">${edit?APD.map(a=>`<label><input type="checkbox" data-chk="apd" data-k="${k}" data-n="${esc(a)}" ${ap.includes(a)?'checked':''}>${a}</label>`).join(''):ap.map(a=>`<span class="chip">${esc(a)}</span>`).join('')||'-'}</div></div></section>`}
function stepJsea(){return `<h3>JSEA (Job Safety Environment Analysis)</h3><p class="note" style="margin:4px 0 12px">Uraikan tiap tahapan pekerjaan, bahayanya, dan cara pengendaliannya.</p>
 <div class="tablewrap"><table style="min-width:900px"><thead><tr><th>No</th><th>Tahapan pekerjaan</th><th>PIC</th><th>Bahaya</th><th>Pengendalian risiko</th><th>Aspek lingkungan</th><th>Pengendalian dampak</th></tr></thead><tbody>${wiz.jsea.map((r,i)=>`<tr><td class="n">${i+1}</td>${['tahap','pic','bahaya','kendali','lingk','kendaliLing'].map(k=>`<td><textarea class="cell" rows="2" id="js-${i}-${k}" data-ctx="wiz" data-bind="jsea.${i}.${k}" aria-label="${k} baris ${i+1}">${esc(r[k])}</textarea></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="actions"><button class="btn ghost" data-act="addj">Tambah tahapan</button></div>`}
function stepReview(){const g=wiz.general;return `<h3 style="margin-bottom:12px">Periksa sebelum kirim</h3>${dl(g)}<p style="margin:14px 0 4px"><b>${wiz.workers.filter(w=>w.nama.trim()).length}</b> pekerja terdaftar, <b>${wiz.types.length}</b> jenis izin khusus: ${wiz.types.map(k=>`<span class="chip">${TYPES[k].nama}</span>`).join(' ')||'-'}, <b>${wiz.jsea.filter(r=>r.tahap.trim()).length}</b> tahapan JSEA.</p><p class="note">Dengan mengirim, kontraktor menyatakan data benar dan bersedia mematuhi Peraturan LK3 Kontraktor TJFI. HSE dapat menghentikan pekerjaan tanpa izin kapan saja.</p><div class="hp" aria-hidden="true"><label>Website<input id="hp" tabindex="-1" autocomplete="off"></label></div>`}
function dl(g){const r=[['Kontraktor',g.kontraktor],['Judul kerja',g.judul],['Plant',g.plant],['Lokasi',g.lokasi],['Dept. pemberi kerja',g.dept],['PIC TJFI',`${g.picTjfi||''} ${g.telpTjfi||''}`],['PIC kontraktor',`${g.picKon||''} ${g.telpKon||''}`],['Pengawas K3 kontraktor',`${g.pengawasKon||''} ${g.telpPengawas||''}`],['Jumlah pekerja',g.jumlah],['Periode',`${fmt(g.mulai)} s/d ${fmt(g.selesai)}`]];return `<dl class="dl">${r.map(([a,b])=>`<div><dt>${a}</dt><dd>${esc(String(b||'').trim())||'-'}</dd></div>`).join('')}</dl>`}
function validate(){
 const g=wiz.general;
 if(wstep===0){
  for(const [k,l] of [['kontraktor','nama kontraktor'],['judul','judul kerja'],['lokasi','lokasi kerja'],['plant','plant tempat pekerjaan'],['dept','departemen pemberi kerja'],['picKon','PIC kontraktor'],['pengawasKon','pengawas K3 kontraktor'],['jumlah','jumlah pekerja']])if(!String(g[k]).trim())return 'Isi '+l+' terlebih dahulu.';
  if(!(+g.jumlah>=1))return 'Jumlah pekerja tidak valid.';
  if(g.mulai<todayJ())return 'Tanggal mulai tidak boleh sebelum hari ini.';
  if(g.selesai<g.mulai)return 'Tanggal selesai tidak boleh sebelum tanggal mulai.';
 }
 if(wstep===1&&!wiz.workers.some(w=>w.nama.trim()))return 'Isi minimal satu nama pekerja.';
 if(wstep===2){if(!wiz.types.length)return 'Pilih minimal satu jenis izin.';for(const k of wiz.types)if((wiz.checks[k]||[]).length<TYPES[k].items.length||(wiz.checks[k]||[]).some(v=>!v))return 'Semua item checklist '+TYPES[k].nama+' harus dijawab Ya atau T/A.'}
 if(wstep===3&&!wiz.jsea.some(r=>r.tahap.trim()&&r.bahaya.trim()&&r.kendali.trim()))return 'Isi minimal satu tahapan JSEA lengkap dengan bahaya dan pengendaliannya.';
 return '';
}

function flowHtml(status){
 const idx=FLOW.indexOf(status);
 if(idx<0)return `<ul class="flow"><li class="cur">${esc(status)}</li></ul>`;
 return `<ul class="flow">${FLOW.map((s,i)=>`<li class="${i<idx?'done':i===idx?'cur':''}">${s}</li>`).join('')}</ul>`;
}
const canDl=p=>p.status==='Disetujui'||p.status==='Selesai';

let stQ='',stRes=null,stErr='';

 stQ=id||stQ;stRes=null;stErr='';
 const render=()=>{
  const r=stRes;let out='';
  if(stErr)out=`<p class="err">${esc(stErr)}</p>`;

   out=`<p><b>${esc(r.general.judul)}</b><br>${esc(r.general.kontraktor)} · ${esc(r.general.plant)} · ${esc(r.general.lokasi)} · ${fmt(r.general.mulai)} s/d ${fmt(r.general.selesai)}</p>${flowHtml(r.eff)}<p>${pill(r.eff)}</p>

  }

  <div class="panel"><form data-form="status"><label class="f" style="max-width:380px">Nomor permit<input id="stq" data-ctx="st" data-bind="q" placeholder="Contoh: WP-2026-11-003" autocomplete="off" value="${esc(stQ)}"></label><div class="actions"><button class="btn primary" type="submit">Cek status</button></div></form><div style="margin-top:14px">${out}</div></div>`;

 const sd=s.dept?`<div class="dsig"><b>Ditandatangani secara digital</b><br>${esc(s.dept.nama)}<br>${esc(s.dept.jab)}<br>${fmtDT(s.dept.waktu)}<br>Kode verifikasi: <span class="mono">${esc(s.dept.kode)}</span></div>`:'<p>Belum ditandatangani.</p>';
 const okImg=s.hse&&s.hse.ttd&&/^data:image\/png;base64,[A-Za-z0-9+\/=]+$/.test(s.hse.ttd);
 const sh=s.hse?`<div class="sigrow"><div class="stamp"><b>DISETUJUI</b><span>HSE · PT TJ FORGE INDONESIA</span><span>${fmtDT(s.hse.waktu)}</span><span>${esc(p.id)}</span></div>${okImg?`<img alt="Tanda tangan ${esc(s.hse.nama)}" src="${s.hse.ttd}">`:''}</div><div style="margin-top:6px"><b>${esc(s.hse.nama)}</b><br>${esc(s.hse.jab)}<br>Kode verifikasi: <span class="mono">${esc(s.hse.kode)}</span></div>`:'<p>Belum ditandatangani.</p>';
 return `<article class="sheet" aria-label="Lembar izin kerja ${esc(p.id)}">
  <h1>SURAT IZIN KERJA KONTRAKTOR</h1><div class="sub">PT TJ FORGE INDONESIA · Work Permit</div>
  <div class="sh-head"><div class="sh-info"><div><b class="mono">${esc(p.id)}</b></div><div>Status saat dicetak: <b>${esc(p.eff)}</b></div><div>Berlaku: <b>${fmt(g.mulai)} s/d ${fmt(g.selesai)}</b></div></div><div class="sh-qr">${qrSvg(baseUrl()+'#/status/'+encodeURIComponent(p.id))}<div>Scan untuk cek status terbaru</div></div></div>

 if(!S.token||!S.user){location.hash='#/login';return}

function appTabs(active){

function extraMatch(p){
 const g=p.general;
 if(fl.plant==='both'&&g.plant!=='Plant 1 dan Plant 2')return false;
 if((fl.plant==='Plant 1'||fl.plant==='Plant 2')&&!(g.plant||'').includes(fl.plant))return false;
 if(fl.kon&&g.kontraktor!==fl.kon)return false;
 if(fl.jenis&&!p.types.includes(fl.jenis))return false;
 if(fl.dept&&g.dept!==fl.dept)return false;
 if(fl.dari&&g.selesai<fl.dari)return false;
 if(fl.sampai&&g.mulai>fl.sampai)return false;
 const q=fl.q.trim().toLowerCase();
 if(q){const hay=[p.id,g.judul,g.kontraktor,g.lokasi,g.plant,g.dept,g.picKon,g.picTjfi,g.pengawasKon,p.workerNames,p.types.map(k=>TYPES[k].nama).join(' ')].join(' ').toLowerCase();if(!q.split(/\s+/).every(w=>hay.includes(w)))return false}
 return true;
}

 <div class="tablewrap"><table style="min-width:520px"><thead><tr><th>Tanggal</th><th>Waktu</th><th>O2 (%)</th><th>LEL (%)</th><th>Beracun</th><th>Paraf</th><th>Hasil</th></tr></thead><tbody>${p.gas.map(r=>`<tr><td>${fmt(r.tanggal)}</td><td>${esc(r.waktu)}</td><td>${esc(r.o2)}</td><td>${esc(r.lel)}</td><td>${esc(r.toks)}</td><td>${esc(r.paraf)}</td><td class="${gasBad(r)?'gasbad':'gasok'}">${gasBad(r)?'Di luar batas':'Aman'}</td></tr>`).join('')||'<tr><td colspan="7" class="note">Belum ada pembacaan.</td></tr>'}</tbody></table></div>
 ${canAdd?`<div class="grid" style="margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))"><label class="f">O2 (%)<input id="g-o2" inputmode="decimal" value="20.9"></label><label class="f">LEL (%)<input id="g-lel" inputmode="decimal" value="0"></label><label class="f">Beracun<input id="g-toks" inputmode="decimal" value="0"></label><label class="f">Paraf<input id="g-paraf" value="${esc(S.user.nama)}"></label></div><div class="actions"><button class="btn primary" data-act="do" data-a="gas">Catat pembacaan</button></div>`:'<p class="note" style="margin-top:8px">Pembacaan dicatat HSE saat permit aktif.</p>'}</div>`;

const MSG={know:'Permit diketahui, diteruskan ke HSE.',return:'Permit dikembalikan ke kontraktor.',approve:'Permit disetujui.',reject:'Permit ditolak.',close:'Permit ditutup.',gas:'Pembacaan gas dicatat.'};
async function doAct(a){
 const note=(($('#note')||{}).value||'').trim();
 if((a==='return'||a==='reject')&&!note){toast('Isi catatan alasan terlebih dahulu.');return}
 const extra=a==='gas'?{o2:$('#g-o2').value,lel:$('#g-lel').value,toks:$('#g-toks').value,paraf:$('#g-paraf').value}:{};
 try{
  const r=await api(a,Object.assign({id:S.cur.id,note},extra));
  S.cur=r.permit;
  toast(a==='gas'&&gasBad(r.permit.gas[r.permit.gas.length-1])?'Pembacaan di luar batas. Hentikan pekerjaan.':MSG[a]);

 }catch(e){toast(e.message)}
}

/* ===== Kelola akun (HSE) ===== */
async function pageAkun(){
 loading();
 const [u,l]=await Promise.all([api('users_list'),api('log_list')]);
 const users=u.users,logs=l.log;let err='';
 const refresh=async()=>{const [a,b]=await Promise.all([api('users_list'),api('log_list')]);users.length=0;users.push(...a.users);logs.length=0;logs.push(...b.log)};
 ACT.addacc=async()=>{
  const f=accForm;err='';
  try{const r=await api('user_create',{nama:f.nama,username:f.user,role:f.role,dept:f.dept});accShow={user:r.username,pass:r.tempPassword,aksi:'dibuat'};accForm={nama:'',user:'',role:'DEPT',dept:''};await refresh()}catch(e){err=e.message}
  current();window.scrollTo(0,0);
 };
 ACT.aa=async b=>{
  const k=b.dataset.k,user=b.dataset.id;
  try{
   if(k==='reset'){const r=await api('user_reset',{username:user});accShow={user:r.username,pass:r.tempPassword,aksi:'direset'};window.scrollTo(0,0)}
   else{await api('user_active',{username:user,aktif:k==='on'});toast(k==='on'?'Akun diaktifkan.':'Akun dinonaktifkan.')}
   await refresh();
  }catch(e){toast(e.message)}
  current();
 };
 ACT.accdone=()=>{accShow=null;current()};
 draw(()=>{
  const nH=users.filter(x=>x.role==='HSE'&&x.aktif).length,nD=users.filter(x=>x.role==='DEPT'&&x.aktif).length,nOff=users.filter(x=>!x.aktif).length,f=accForm;
  const shown=accShow?`<div class="success" style="margin-bottom:14px"><div>Password sementara untuk <b>${esc(accShow.user)}</b> (${accShow.aksi}). Catat sekarang, password ini tidak ditampilkan lagi:</div><div class="big">${esc(accShow.pass)}</div><div class="note" style="color:inherit;margin-top:6px">Sampaikan langsung kepada pengguna. Pengguna wajib menggantinya saat login pertama.</div><div class="actions"><button class="btn" data-act="accdone">Sudah dicatat</button></div></div>`:'';
  app.innerHTML=`${appTabs('akun')}<div class="who"><div><h2>Kelola akun</h2><p>Semua akun portal dibuat dan dikelola oleh HSE. Kontraktor tidak memerlukan akun.</p></div></div>
  <div class="stats"><div class="stat"><b>${nH}</b><span>HSE aktif</span></div><div class="stat"><b>${nD}</b><span>Akun departemen aktif</span></div><div class="stat"><b>${nOff}</b><span>Nonaktif</span></div></div>
  ${nH<2?'<div class="draft" style="background:var(--bad-bg);color:var(--bad);font-weight:600">Akun HSE aktif kurang dari dua. Tambahkan satu akun HSE lagi agar akun departemen tetap bisa dikelola bila satu orang berhalangan.</div>':''}
  ${shown}
  <div class="panel"><h3 style="margin-bottom:10px">Tambah akun</h3><div class="grid">
   <label class="f">Nama pengguna<input id="af-nama" data-ctx="acc" data-bind="nama" value="${esc(f.nama)}"></label>
   <label class="f">Username<input id="af-user" data-ctx="acc" data-bind="user" autocapitalize="none" value="${esc(f.user)}" placeholder="contoh: produksi.02"></label>
   <label class="f">Peran<select id="af-role" data-ctx="acc" data-bind="role" data-rr="1"><option value="DEPT" ${f.role==='DEPT'?'selected':''}>Dept. Pemberi Kerja</option><option value="HSE" ${f.role==='HSE'?'selected':''}>HSE</option></select></label>
   ${f.role==='DEPT'?`<label class="f">Departemen<select id="af-dept" data-ctx="acc" data-bind="dept"><option value="">Pilih departemen</option>${DEPTS.map(d=>`<option ${f.dept===d?'selected':''}>${d}</option>`).join('')}</select></label>`:''}
  </div><p class="note" style="margin:10px 0 0">${f.role==='DEPT'?'Akun departemen hanya melihat permit departemennya dan tidak punya akses ke fitur HSE.':'Akun HSE bisa menyetujui permit dan mengelola semua akun.'}</p>
  <div class="actions"><button class="btn primary" data-act="addacc">Buat akun</button></div><div class="err" role="alert">${esc(err)}</div></div>
  <div class="panel"><h3 style="margin-bottom:10px">Daftar akun</h3><div class="tablewrap"><table style="min-width:760px"><thead><tr><th>Nama</th><th>Username</th><th>Peran</th><th>Departemen</th><th>Login terakhir</th><th>Status</th><th>Tindakan</th></tr></thead><tbody>${users.map(a=>`<tr><td>${esc(a.nama)}</td><td style="font-family:var(--mono)">${esc(a.username)}</td><td>${a.role==='HSE'?'HSE':'Dept. Pemberi Kerja'}</td><td>${esc(a.dept)||'-'}</td><td>${a.lastLogin?fmtDT(a.lastLogin):'Belum pernah'}</td><td><span class="pill ${a.aktif?'s-Disetujui':'s-Dikembalikan'}">${a.aktif?'Aktif':'Nonaktif'}</span></td><td><div class="actions" style="margin:0"><button class="btn sm" data-act="aa" data-k="reset" data-id="${esc(a.username)}">Reset password</button>${a.aktif?`<button class="btn sm bad" data-act="aa" data-k="off" data-id="${esc(a.username)}">Nonaktifkan</button>`:`<button class="btn sm ok" data-act="aa" data-k="on" data-id="${esc(a.username)}">Aktifkan</button>`}</div></td></tr>`).join('')}</tbody></table></div></div>
  <div class="panel"><h3 style="margin-bottom:10px">Riwayat sistem (200 terakhir)</h3><div class="tablewrap" style="max-height:340px;overflow:auto"><table style="min-width:560px"><thead><tr><th>Waktu</th><th>Pengguna</th><th>Aksi</th><th>Detail</th></tr></thead><tbody>${logs.map(x=>`<tr><td>${fmtDT(x.waktu)}</td><td>${esc(x.user)}</td><td>${esc(x.aksi)}</td><td>${esc(x.detail)}</td></tr>`).join('')}</tbody></table></div></div>`;
 });
}

/* ===== Profil & ganti password ===== */
function pwFormHtml(forced){
 return `<form data-form="pw"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
  <label class="f">Password saat ini${forced?' (password sementara)':''}<input id="pw-old" type="password" autocomplete="current-password" required></label>
  <label class="f">Password baru (minimal 8 karakter)<input id="pw-n1" type="password" autocomplete="new-password" required></label>
  <label class="f">Ulangi password baru<input id="pw-n2" type="password" autocomplete="new-password" required></label></div>
  <div class="actions"><button class="btn primary" type="submit">Simpan password</button></div><div class="err" role="alert">${esc(pwErr)}</div></form>`;
}
async function FORM_pw(){
 const o=$('#pw-old').value,a=$('#pw-n1').value,b=$('#pw-n2').value;pwErr='';
 if(a!==b)pwErr='Pengulangan password baru tidak sama.';
 else try{await api('pw_change',{oldPassword:o,newPassword:a});S.user.mustChange=false;ls.set('wp-user',JSON.stringify(S.user));toast('Password berhasil diganti.');go('#/app');return}catch(e){pwErr=e.message}
 current();
}
function pagePwForced(){
 pwErr='';
 draw(()=>{app.innerHTML=`<div class="loginbox"><div class="panel"><h2 style="margin-bottom:4px">Ganti password</h2><p class="note" style="margin:0 0 12px">Ini login pertama Anda atau password baru direset oleh HSE. Buat password baru untuk melanjutkan.</p>${pwFormHtml(true)}</div></div>`});
}
function pageProfil(){
 pwErr='';const u=S.user,isH=u.role==='HSE';
 draw(()=>{app.innerHTML=`${appTabs('profil')}<div class="who"><div><h2>Profil</h2><p>${esc(u.nama)} · ${isH?'HSE':'Dept. '+esc(u.dept)} · ${esc(u.username)}</p></div></div>
 <div class="panel"><h3 style="margin-bottom:10px">Ganti password</h3>${pwFormHtml(false)}</div>
 ${isH?`<div class="panel"><h3 style="margin-bottom:4px">Tanda tangan HSE</h3><p class="note" style="margin:0 0 10px">Tanda tangan ini dicetak di lembar izin bersama stempel persetujuan saat Anda menyetujui permit. ${u.hasTtd?'Tanda tangan sudah tersimpan; menggambar ulang akan menggantinya.':'Belum ada tanda tangan tersimpan.'} Permit yang sudah disetujui tidak berubah.</p><canvas id="pad" class="pad" width="360" height="120" aria-label="Kotak tanda tangan"></canvas><div class="actions"><button class="btn" data-act="padclear">Hapus coretan</button><button class="btn primary" data-act="padsave">Simpan tanda tangan</button>${u.hasTtd?'<button class="btn bad" data-act="padremove">Hapus tanda tangan tersimpan</button>':''}</div><div id="padmsg" class="note" style="margin-top:8px"></div></div>`:''}`;
  if(isH)initPad();
 });
}
let padDirty=false;
function initPad(){
 const c=$('#pad');if(!c)return;const x=c.getContext('2d');x.lineWidth=2.4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#1a2b6b';padDirty=false;
 let down=false,last=null;
 const pt=e=>{const r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};
 c.onpointerdown=e=>{down=true;last=pt(e);c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(last.x+.1,last.y+.1);x.stroke();padDirty=true;e.preventDefault()};
 c.onpointermove=e=>{if(!down)return;const p=pt(e);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();last=p;e.preventDefault()};
 const up=()=>{down=false};c.onpointerup=up;c.onpointercancel=up;
}

/* ===== Aksi (klik) & form ===== */
const FORM={status:null,login:null,pw:null};
FORM.status=()=>{const v=($('#stq').value||'').trim();if(!v)return;stQ=v;go('#/status/'+encodeURIComponent(v))};
const ACT={
 nav:b=>{location.hash=b.dataset.to},
 logout:()=>logout(false),
 menu:b=>{const n=$('#mainNav');const o=n.classList.toggle('open');b.setAttribute('aria-expanded',o?'true':'false')},
 print:()=>{try{window.print()}catch(e){toast('Cetak tidak tersedia. Buka halaman ini di browser.')}},
 setapi:e=>{const v=prompt('Alamat Web App Apps Script (berakhiran /exec):',ls.get('wp-api')||'');if(v!==null){v.trim()?ls.set('wp-api',v.trim()):ls.del('wp-api');toast('Alamat server disimpan.')}},
 again:()=>{wiz=newDraft();wstep=0;wizDone=null;wizErr='';ls.del('wp-draft');current()},
 wprev:()=>{wstep--;wizErr='';saveDraft();current();window.scrollTo(0,0)},
 wnext:()=>{const e=validate();if(e){wizErr=e;current();return}wizErr='';wstep++;saveDraft();current();window.scrollTo(0,0)},
 wsend:async()=>{
  const g=wiz.general;
  try{
   const r=await api('submit',{general:g,workers:wiz.workers,types:wiz.types,checks:wiz.checks,apd:wiz.apd,desc:wiz.desc,jsea:wiz.jsea,hp:($('#hp')||{}).value||''},false);
   wizDone=r.id;wizDone_dept=g.dept;ls.del('wp-draft');wiz=null;wstep=0;window.scrollTo(0,0);current();
  }catch(e){wizErr=e.message;current()}
 },
 addw:()=>{wiz.workers.push({nama:'',unit:'',idn:''});saveDraft();current()},
 addj:()=>{wiz.jsea.push({tahap:'',pic:'',bahaya:'',kendali:'',lingk:'',kendaliLing:''});saveDraft();current()},
 ck:b=>{wiz.checks[b.dataset.k][+b.dataset.i]=b.dataset.v;saveDraft();current()},
 filter:b=>{filter=b.dataset.k;current()},
 preset:b=>{setPreset(b.dataset.k);current()},
 freset:()=>{Object.keys(fl).forEach(k=>fl[k]='');current()},
 reload:()=>route(),
 do:b=>doAct(b.dataset.a),
 padclear:()=>{const c=$('#pad');c.getContext('2d').clearRect(0,0,c.width,c.height);padDirty=false;$('#padmsg').textContent=''},
 padsave:async()=>{
  const c=$('#pad');if(!padDirty){$('#padmsg').textContent='Gambar tanda tangan terlebih dahulu.';return}
  const small=document.createElement('canvas');small.width=240;small.height=80;small.getContext('2d').drawImage(c,0,0,240,80);
  try{await api('ttd_save',{ttd:small.toDataURL('image/png')});S.user.hasTtd=true;ls.set('wp-user',JSON.stringify(S.user));toast('Tanda tangan disimpan.');pageProfil()}catch(e){$('#padmsg').textContent=e.message}
 },
 padremove:async()=>{try{await api('ttd_save',{ttd:''});S.user.hasTtd=false;ls.set('wp-user',JSON.stringify(S.user));toast('Tanda tangan dihapus.');pageProfil()}catch(e){toast(e.message)}}
};
const CTX={wiz:()=>wiz,fl:()=>fl,acc:()=>accForm,st:{get q(){return stQ},set q(v){stQ=v}}};
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled){e.preventDefault();const f=ACT[b.dataset.act];if(f)f(b,e)}});
top_.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){const f=ACT[b.dataset.act];if(f)f(b,e)}});
app.addEventListener('input',e=>{
 const t=e.target;if(!t.dataset||!t.dataset.bind)return;
 const c=CTX[t.dataset.ctx];const obj=typeof c==='function'?c():c;if(!obj)return;
 if(t.dataset.ctx==='st'){stQ=t.value;return}
 setPath(obj,t.dataset.bind,t.value);
 if(t.dataset.ctx==='wiz')saveDraft();
 if(t.dataset.bind==='role'&&t.dataset.ctx==='acc'&&t.value==='HSE')accForm.dept='';
 if(t.dataset.rr)rerender();
});
app.addEventListener('change',e=>{
 const t=e.target;if(!t.dataset||!t.dataset.chk)return;
 if(t.dataset.chk==='type'){const k=t.dataset.k;if(t.checked){if(!wiz.types.includes(k))wiz.types.push(k);wiz.checks[k]=TYPES[k].items.map(()=>'');wiz.apd[k]=[]}else{wiz.types=wiz.types.filter(x=>x!==k);delete wiz.checks[k];delete wiz.apd[k]}saveDraft();current()}
 if(t.dataset.chk==='apd'){const k=t.dataset.k,n=t.dataset.n;const l=wiz.apd[k]=wiz.apd[k]||[];if(t.checked&&!l.includes(n))l.push(n);if(!t.checked)wiz.apd[k]=l.filter(x=>x!==n);saveDraft()}
});
app.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target.dataset.form;
 if(f==='pw')return FORM_pw();
 if(FORM[f])FORM[f](e);
});

/* ===== Mulai ===== */
if(S.token&&!S.user){S.token=''}
route();
</script>
