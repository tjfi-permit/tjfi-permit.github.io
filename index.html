<style>
:root{
  --bg:#F5F7FB; --surface:#FFFFFF; --surface2:#F5F8FC; --ink:#142132; --muted:#5F7086; --line:#E1E7EF;
  --navy:#142132; --navy2:#23374d; --accent:#FF8200; --accent-ink:#FFFFFF; --blue:#1A6FD4;
  --ok:#157A3E; --ok-bg:#DDF3E5; --warn:#8A5A00; --warn-bg:#FFF0CC; --bad:#B42318; --bad-bg:#FDE4E1; --info:#1A56A8; --info-bg:#DFEBFB; --neutral-bg:#E6EBF2;
  --font:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
#app.page{max-width:1080px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h2{font-size:18px}h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
body.busy::before{content:"";position:fixed;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,var(--accent),var(--blue));z-index:50;animation:bar 1s linear infinite}
@keyframes bar{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.seg{display:flex;background:var(--neutral-bg);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap;width:max-content;max-width:100%}
.seg button{border:0;background:transparent;color:var(--ink);padding:7px 14px;border-radius:8px;font-weight:500;font-size:13px}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff;font-weight:600}
.who{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin:18px 0 14px}

.lock{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);background:var(--neutral-bg);padding:5px 10px;border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;width:100%}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}

button.stat[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel+.panel{margin-top:14px}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}

.row .main small{color:var(--muted)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11.5px;background:var(--neutral-bg);color:var(--ink);padding:2px 8px;border-radius:999px}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.s-Diajukan{background:var(--warn-bg);color:var(--warn)}
.s-Diketahui{background:var(--info-bg);color:var(--info)}
.s-Dikembalikan{background:var(--neutral-bg);color:var(--muted)}
.s-Disetujui{background:var(--ok-bg);color:var(--ok)}
.s-Aktif{background:var(--ok);color:var(--surface)}
.s-Selesai{background:var(--neutral-bg);color:var(--ink)}
.s-Ditolak,.s-Kedaluwarsa{background:var(--bad-bg);color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:9px;font-weight:600;text-decoration:none;color:var(--ink);display:inline-block}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 12px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea,.cell{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-weight:400;font-size:14px;min-width:0;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid .wide{grid-column:1/-1}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.steps span{font-size:12.5px;padding:5px 12px;border-radius:999px;background:var(--neutral-bg);color:var(--muted);font-weight:500}
.steps span.on{background:var(--navy);color:#fff}
.steps span.done{background:var(--ok-bg);color:var(--ok)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:13.5px}
th{background:var(--surface2);text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;color:var(--muted);width:34px}
.typepick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.typepick label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);cursor:pointer}
.typepick label:has(input:checked){border-color:var(--accent);background:var(--surface2);box-shadow:inset 0 0 0 1px var(--accent)}
.typepick small{display:block;color:var(--muted);font-weight:400}
.chk{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.yn{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.yn button{border:0;background:var(--surface);padding:5px 12px;font-weight:600;font-size:12.5px;color:var(--muted)}
.yn button[aria-pressed=true].y{background:var(--ok);color:var(--surface)}
.yn button[aria-pressed=true].t{background:var(--neutral-bg);color:var(--ink)}
.apd{display:flex;flex-wrap:wrap;gap:6px}
.apd label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;background:var(--surface);cursor:pointer}
.apd label:has(input:checked){background:var(--info-bg);border-color:var(--blue);color:var(--info)}
.draft{background:var(--warn-bg);color:var(--warn);font-size:12.5px;padding:6px 10px;border-radius:8px;margin:0 0 8px}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 20px;margin:0}
.dl div{min-width:0}.dl dt{font-size:12px;color:var(--muted)}.dl dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px;padding:0}
.flow li{list-style:none;font-size:12.5px;padding:6px 12px;border-radius:8px;background:var(--neutral-bg);color:var(--muted)}
.flow li.done{background:var(--ok-bg);color:var(--ok);font-weight:600}
.flow li.cur{background:var(--navy);color:#fff;font-weight:600}
.log{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.log li{display:grid;grid-template-columns:150px 1fr;gap:8px;font-size:13px}
.log time{font-family:var(--mono);font-size:12px;color:var(--muted)}
.gasok{color:var(--ok);font-weight:600}.gasbad{color:var(--bad);font-weight:700}
.note{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--bad);margin-top:8px}
.back{background:none;border:0;color:var(--blue);padding:0;font-weight:600;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;z-index:60;max-width:90vw}
.success{border:1px solid var(--ok);background:var(--ok-bg);color:var(--ok);padding:16px;border-radius:12px}
.success .big{font-family:var(--mono);font-size:22px;font-weight:600;overflow-wrap:anywhere}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:18px}
.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;text-decoration:none;color:var(--ink)}
.card:hover{border-color:var(--accent)}
.card h3{font-size:17px;margin-bottom:6px}.card p{margin:0;color:var(--muted)}
.card.accent{background:var(--navy);color:#fff;border-color:var(--navy)}.card.accent p{color:#B7C6DC}
.loginbox{max-width:420px;margin:28px auto 0}
.fbar{margin-bottom:14px}.fbar .grid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.fbar .grid .wide{grid-column:1/-1}
canvas.pad{width:100%;max-width:360px;height:120px;border:1px dashed var(--muted);border-radius:8px;background:#fff;touch-action:none;display:block}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* ==== SCS Work Permit v2: monitoring, checklist, peninjauan ==== */
.review-check{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid #e3eaf0;border-radius:10px;background:#f7fafc;margin-top:12px;font-size:13px;font-weight:550;line-height:1.6}
.review-check input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--ok)}
.ta-reason{margin:0 0 9px;padding:8px 14px 12px 18px;background:#fff8ed;border-left:3px solid var(--accent);font-size:12px}
.chk+.ta-reason{margin-top:-1px}
.yn button.n[aria-pressed=true]{background:var(--bad);color:white}
.alert-danger{background:var(--bad-bg);color:var(--bad);padding:9px 12px;border-radius:8px;font-size:12px;font-weight:600;margin:3px 0 8px}
.monitor-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.monitor-grid .panel{margin:0;min-width:0}
.monitor-stats{margin-top:14px}
.monitor-stats .stat{border-top:3px solid #ff8200;min-height:112px}
.monitor-stats .stat small{display:block;margin-top:6px;font-size:11px;color:var(--muted);line-height:1.4}
.bars{display:grid;gap:13px;margin-top:17px}
.barline{display:grid;grid-template-columns:minmax(94px,40%) 1fr 26px;align-items:center;gap:10px;font-size:12px}
.barline>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.barline>b{font-variant-numeric:tabular-nums;text-align:right}
.track{height:10px;background:#edf1f7;border-radius:999px;overflow:hidden}
.track>div{height:100%;background:linear-gradient(90deg,#ff8200,#ffad50);border-radius:999px}
.quickbar{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 12px}
.monitor-filters .grid{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.dashboard-hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#111827 0%,#1f2937 52%,#ff8200 160%);color:#fff;border-radius:18px;padding:22px 22px 18px;border:1px solid rgba(255,255,255,.08);box-shadow:0 16px 38px rgba(17,24,39,.16);margin-bottom:14px}
.dashboard-hero::after{content:'';position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),rgba(255,255,255,0) 70%)}
.hero-top{position:relative;z-index:1;display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.hero-top h2{margin:0;color:#fff}
.hero-top p{margin:4px 0 0;color:rgba(255,255,255,.82);max-width:760px}
.hero-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);font-size:12px;font-weight:700;color:#fff}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:16px}
.hero-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(4px);border-radius:14px;padding:14px}
.hero-card b{display:block;font-size:28px;line-height:1.05;color:#fff;font-variant-numeric:tabular-nums}
.hero-card span{display:block;margin-top:5px;font-size:12px;color:rgba(255,255,255,.86)}
.hero-card small{display:block;margin-top:6px;font-size:11px;color:rgba(255,255,255,.66);line-height:1.35}
.monitor-shell{display:grid;grid-template-columns:1.35fr .95fr;gap:14px;margin:14px 0}
.monitor-shell .panel{margin:0;min-width:0}
.monitor-stack{display:grid;gap:14px}
.funnel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px}
.funnel-step{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 12px;min-height:102px}
.funnel-step:not(:last-child)::after{content:'→';position:absolute;right:-9px;top:50%;transform:translateY(-50%);font-size:18px;color:#ffb66e;font-weight:700}
.funnel-step b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.funnel-step span{display:block;margin-top:5px;font-weight:700;font-size:13px}
.funnel-step small{display:block;margin-top:6px;color:var(--muted);font-size:11px;line-height:1.35}
.monitor-split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:14px 0}
.monitor-split .panel{margin:0;min-width:0}
.plant-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.plant-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.plant-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}
.plant-title{font-weight:800;font-size:15px}
.plant-meta{font-size:12px;color:var(--muted);margin-top:3px}
.metricline{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px dashed #edf1f7;font-size:13px}
.metricline:first-of-type{border-top:0;padding-top:0}
.metricline b{font-variant-numeric:tabular-nums}
.mini-list{display:grid;gap:10px}
.mini-item{display:flex;align-items:flex-start;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.mini-badge{min-width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:#fff3e2;color:#ff8200;border:1px solid #ffd8ac}
.mini-item b{display:block;font-size:13px;line-height:1.35}
.mini-item small{display:block;margin-top:4px;color:var(--muted);line-height:1.45}
.softtag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;margin-top:7px}
.softtag.warning{background:#fff5d8;color:#8b6500}.softtag.danger{background:#ffe5e5;color:#b42318}.softtag.ok{background:#e8fbef;color:#127a37}.softtag.info{background:#e9f2ff;color:#1858b8}
.spark{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:12px;padding-top:8px}
.spark-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.spark-bar{width:100%;max-width:44px;min-height:10px;border-radius:12px 12px 4px 4px;background:linear-gradient(180deg,#ffb25a,#ff8200);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.spark-col b{font-size:11px;font-variant-numeric:tabular-nums}
.spark-col span{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.2}
.status-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-top:14px}
.status-box{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px}
.status-box b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.05}
.status-box span{display:block;margin-top:4px;font-size:12px;font-weight:700}
.status-box small{display:block;margin-top:5px;color:var(--muted);font-size:11px;line-height:1.35}
.status-box.warn{border-left:4px solid #f59e0b}.status-box.bad{border-left:4px solid #ef4444}.status-box.ok{border-left:4px solid #16a34a}.status-box.info{border-left:4px solid #2563eb}
.monitor-table table{min-width:720px}
.kpi-note{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed #e6ecf2;color:var(--muted);font-size:12px}
@media(max-width:980px){.monitor-shell,.monitor-split{grid-template-columns:1fr}.plant-cards{grid-template-columns:1fr}.funnel{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.funnel-step:not(:last-child)::after{display:none}}
@media(max-width:720px){.monitor-grid{grid-template-columns:1fr}.review-check{padding:10px}.dashboard-hero{padding:18px}.hero-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.status-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.hero-grid,.status-grid{grid-template-columns:1fr}.funnel{grid-template-columns:1fr}.mini-item{padding:10px}}
@media print{.monitor-grid,.quickbar,.dashboard-hero{display:none!important}}
.jx td{background:#eef1f5;color:#5a6878;font-size:12.5px;font-style:italic;vertical-align:top}.jx td.n{font-weight:700;font-style:normal;white-space:nowrap}.cell::placeholder{color:#a3adba;font-style:italic;font-size:12px}
</style>

const DEPTS_BY_PLANT={
 'Plant 1':['HRGA & IT','Accounting','Purchasing','Sales','Machining','Maintenance','PPIC','QA & QC','Forging'],
 'Plant 2':['HRGA','Assembling','Machining','Maintenance','PPIC','Purchasing','QA & QC']
};
const DEPTS=[...new Set(Object.values(DEPTS_BY_PLANT).flat())].sort((a,b)=>a.localeCompare(b,'id'));
const PLANTS=['Plant 1','Plant 2','Plant 1 dan Plant 2']; // pilihan terakhir untuk data historis / pekerjaan lintas plant
function departmentsForPlant(plant){
 if(DEPTS_BY_PLANT[plant])return DEPTS_BY_PLANT[plant];
 if(plant==='Plant 1 dan Plant 2')return DEPTS_BY_PLANT['Plant 1'].filter(d=>DEPTS_BY_PLANT['Plant 2'].includes(d));
 return [];
}
function deptSelectHtml(plant,current){
 let opts=departmentsForPlant(plant);
 if(current&&!opts.includes(current))opts=[current,...opts]; // data lama tidak hilang saat dibuka
 return `<option value="">${plant?'Pilih departemen':'Pilih plant terlebih dahulu'}</option>`+
  opts.map(d=>`<option value="${esc(d)}" ${current===d?'selected':''}>${esc(d)}${!departmentsForPlant(plant).includes(d)?' (historis)':''}</option>`).join('');
}

const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

const addDays=n=>{const d=new Date(todayJ()+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};

 try{const q=qrcode(0,'M');q.addData(text);q.make();return `<span class="qrbox">${q.createSvgTag(4,0).replace('<svg ','<svg class="qr" role="img" aria-label="Kode QR" ')}</span>`}
 catch(e){return '<span class="note">QR tidak dapat dibuat.</span>'}
}

function stepJsea(){return `<h3>JSEA (Job Safety Environment Analysis)</h3><p class="note" style="margin:4px 0 12px">Uraikan tiap tahapan pekerjaan, bahayanya, dan cara pengendaliannya. Tiga baris <b>Contoh</b> berlatar abu-abu hanya panduan (tidak ikut terkirim); isi baris di bawahnya sesuai pekerjaan Anda.</p>

function stepReview(){const g=wiz.general;return `<h3 style="margin-bottom:12px">Periksa sebelum kirim</h3>${dl(g)}<p style="margin:14px 0 4px"><b>${wiz.workers.filter(w=>w.nama.trim()).length}</b> pekerja terdaftar, <b>${wiz.types.length}</b> jenis izin khusus: ${wiz.types.map(k=>`<span class="chip">${TYPES[k].nama}</span>`).join(' ')||'-'}, <b>${wiz.jsea.filter(r=>r.tahap.trim()).length}</b> tahapan JSEA.</p><p class="note">Dengan mengirim, kontraktor menyatakan data benar dan bersedia mematuhi Peraturan LK3 Kontraktor TJFI. Pilihan T/A memerlukan alasan yang akan dicatat bersama uraian pekerjaan. Pekerjaan hanya boleh dimulai setelah permit disetujui, masa berlaku aktif, serta kondisi lapangan dan pengendalian risiko diverifikasi.</p><div class="hp" aria-hidden="true"><label>Website<input id="hp" tabindex="-1" autocomplete="off"></label></div>`}
function dl(g){const r=[['Kontraktor',g.kontraktor],['Judul kerja',g.judul],['Plant',g.plant],['Lokasi',g.lokasi],['Dept. pemberi kerja',g.dept],['PIC TJFI',`${g.picTjfi||''} ${g.telpTjfi||''}`],['PIC kontraktor',`${g.picKon||''} ${g.telpKon||''}`],['Pengawas K3 kontraktor',`${g.pengawasKon||''} ${g.telpPengawas||''}`],['Jumlah pekerja',g.jumlah],['Periode',`${fmt(g.mulai)} s/d ${fmt(g.selesai)}`]];return `<dl class="dl">${r.map(([a,b])=>`<div><dt>${a}</dt><dd>${esc(String(b||'').trim())||'-'}</dd></div>`).join('')}</dl>`}
function validate(){
 const g=wiz.general;
 if(wstep===0){
  for(const [k,l] of [['kontraktor','nama kontraktor'],['judul','judul kerja'],['lokasi','lokasi kerja'],['plant','plant tempat pekerjaan'],['dept','departemen pemberi kerja'],['picKon','PIC kontraktor'],['pengawasKon','pengawas K3 kontraktor'],['jumlah','jumlah pekerja']])if(!String(g[k]).trim())return 'Isi '+l+' terlebih dahulu.';
  if(!Number.isInteger(+g.jumlah)||+g.jumlah<1||+g.jumlah>500)return 'Jumlah pekerja harus 1 sampai 500 orang.';
  if(!departmentsForPlant(g.plant).includes(g.dept))return 'Departemen tidak sesuai dengan plant yang dipilih.';
  if(!g.picTjfi.trim())return 'Isi PIC PT TJForge Indonesia yang bertanggung jawab.';
  if(!g.telpTjfi.trim()||!g.telpKon.trim())return 'Isi nomor kontak PIC TJForge dan PIC kontraktor.';
  if(!g.mulai||!g.selesai)return 'Isi tanggal mulai dan selesai.';
  if(g.mulai<todayJ())return 'Tanggal mulai tidak boleh sebelum hari ini.';
  if(g.selesai<g.mulai)return 'Tanggal selesai tidak boleh sebelum tanggal mulai.';
 }
 if(wstep===1){
  const n=syncWorkers();if(!n)return 'Isi jumlah pekerja (1 sampai 500) di langkah 1 terlebih dahulu.';
  const rows=wiz.workers;
  const kosong=rows.findIndex(w=>!w.nama.trim()||!w.unit.trim()||!w.idn.trim());
  if(kosong>=0)return `Data pekerja nomor ${kosong+1} belum lengkap. Semua ${n} pekerja wajib diisi nama, unit kerja, dan nomor identitas.`;
  const ids=rows.map(w=>w.idn.trim().toLowerCase());if(new Set(ids).size!==ids.length)return 'Nomor identitas pekerja tidak boleh duplikat.';
 }
 if(wstep===2){
  if(!wiz.types.length)return 'Pilih minimal satu jenis izin.';
  for(const k of wiz.types){
   if(!(wiz.desc[k]||'').trim())return 'Isi uraian pekerjaan untuk '+TYPES[k].nama+'.';
   if(!(wiz.apd[k]||[]).length)return 'Pilih APD yang digunakan untuk '+TYPES[k].nama+'.';
   const checks=wiz.checks[k]||[];
   if(checks.length<TYPES[k].items.length||checks.some(v=>!v))return 'Semua item checklist '+TYPES[k].nama+' harus dijawab.';
   if(checks.includes('n'))return 'Masih ada item Tidak pada '+TYPES[k].nama+'. Perbaiki kondisi sebelum pengajuan.';
   for(let i=0;i<checks.length;i++)if(checks[i]==='t'&&!String((wiz.taReasons[k]||{})[i]||'').trim())return `Alasan T/A butir ${i+1} pada ${TYPES[k].nama} wajib diisi.`;
  }
 }
 if(wstep===3){
  const rows=wiz.jsea.filter(r=>Object.values(r).some(v=>String(v||'').trim()));
  if(!rows.length)return 'Isi minimal satu tahapan JSEA.';
  if(rows.some(r=>!r.tahap.trim()||!r.pic.trim()||!r.bahaya.trim()||!r.kendali.trim()||!r.lingk.trim()||!r.kendaliLing.trim()))return 'Lengkapi semua kolom tiap tahapan JSEA, termasuk aspek lingkungan dan pengendaliannya.';
 }
 return '';
}

let monPlant='all',monMonth='all',monStatus='all',monType='all';
function csvSafe(s){let v=String(s??'').replace(/\r|\n/g,' ');if(/^[\s]*[=+@-]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
function downloadText(name,contents,mime){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([contents],{type:mime}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportPermitCsv(items){
 const cols=['Nomor izin','Status proses','Status saat ini','Plant','Departemen','Kontraktor','Judul pekerjaan','Area','PIC TJFI','Tanggal mulai','Tanggal akhir','Jenis izin','Total pekerja'];
 const rows=items.map(p=>{const g=p.general||{};return [p.id,p.status,p.eff,g.plant,g.dept,g.kontraktor,g.judul,g.lokasi,g.picTjfi,g.mulai,g.selesai,(p.types||[]).map(t=>TYPES[t]?.nama||t).join('; '),g.jumlah]});
 downloadText('TJForge_Work_Permit_'+todayJ()+'.csv','\uFEFF'+[cols,...rows].map(r=>r.map(csvSafe).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast(rows.length+' data permit diekspor.');
}
function permitAttention(p){
 const t=todayJ(),g=p.general||{};
 if(p.eff==='Kedaluwarsa')return ['Kedaluwarsa','danger'];
 if(p.status==='Diajukan')return ['Menunggu departemen','warning'];
 if(p.status==='Diketahui')return ['Menunggu HSE','warning'];
 if(p.status==='Disetujui'&&g.mulai&&g.mulai===t)return ['Terjadwal hari ini','info'];
 if(p.eff==='Aktif')return ['Sedang berlangsung','ok'];
 return ['', ''];
}
function drawBars(items){
 const rows=items.filter(x=>Number(x[1])>0);
 if(!rows.length)return '<p class="note">Belum ada data.</p>';
 const max=Math.max(1,...rows.map(x=>x[1]));
 return `<div class="bars">${rows.map(([name,num])=>`<div class="barline"><span title="${esc(name)}">${esc(name)}</span><div class="track"><div style="width:${Math.max(0,100*num/max).toFixed(1)}%"></div></div><b>${num}</b></div>`).join('')}</div>`;
}
function ymdDate(s){if(!s||!/^(\d{4})-(\d{2})-(\d{2})$/.test(String(s)))return null;return new Date(String(s)+'T00:00:00')}
function diffDays(a,b){const da=ymdDate(a),db=ymdDate(b);if(!da||!db)return null;return Math.round((da-db)/86400000)}
function monitorStage(p){
 if(p.eff==='Kedaluwarsa')return 'Kedaluwarsa';
 if(p.eff==='Aktif')return 'Aktif';
 if(p.status==='Selesai')return 'Selesai';
 if(p.status==='Diajukan')return 'Diajukan';
 if(p.status==='Diketahui')return 'Diketahui';
 if(p.eff==='Disetujui'||p.status==='Disetujui')return 'Disetujui';
 return p.eff||p.status||'-';
}
function matchesMonStatus(p){return monStatus==='all'||monitorStage(p)===monStatus}
function matchesMonType(p){return monType==='all'||(p.types||[]).includes(monType)}
function badgeTone(kind){return kind==='danger'?'danger':kind==='warning'?'warning':kind==='ok'?'ok':'info'}
function drawTrend(series){
 const rows=series.filter(x=>x[1]>0).slice(-6);
 if(!rows.length)return '<p class="note">Belum ada data tren.</p>';
 const max=Math.max(1,...rows.map(x=>x[1]));
 return `<div class="spark">${rows.map(([m,n])=>`<div class="spark-col"><b>${n}</b><div class="spark-bar" style="height:${Math.max(10,Math.round(n/max*110))}px"></div><span>${esc(m)}</span></div>`).join('')}</div>`;
}
function drawFunnel(steps,total){
 return `<div class="funnel">${steps.map(([label,val,desc])=>`<div class="funnel-step"><b>${val}</b><span>${label}</span><small>${desc}${total?` · ${Math.round((val/Math.max(total,1))*100)}% dari total`:''}</small></div>`).join('')}</div>`;
}
function overviewMessage(open,pendingDept,pendingHse,overdue,startToday,endingSoon){
 if(overdue>0)return `Prioritas utama: ${overdue} permit kedaluwarsa perlu ditutup atau diverifikasi oleh HSE.`;
 if(pendingHse>0)return `${pendingHse} permit sedang menunggu keputusan HSE.`;

}

let padDirty=false;
function initPad(){
 const c=$('#pad');if(!c)return;const x=c.getContext('2d');x.lineWidth=2.4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#1a2b6b';padDirty=false;
 let down=false,last=null;
 const pt=e=>{const r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};
 c.onpointerdown=e=>{down=true;last=pt(e);c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(last.x+.1,last.y+.1);x.stroke();padDirty=true;e.preventDefault()};
 c.onpointermove=e=>{if(!down)return;const p=pt(e);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();last=p;e.preventDefault()};
 const up=()=>{down=false};c.onpointerup=up;c.onpointercancel=up;
}

 menu:b=>{const n=$('#mainNav');const o=n.classList.toggle('open');b.setAttribute('aria-expanded',o?'true':'false')},
 print:()=>{try{window.print()}catch(e){toast('Cetak tidak tersedia. Buka halaman ini di browser.')}},
 setapi:e=>{const v=prompt('Alamat Web App Apps Script (berakhiran /exec):',ls.get('wp-api')||'');if(v!==null){v.trim()?ls.set('wp-api',v.trim()):ls.del('wp-api');toast('Alamat server disimpan.')}},
 again:()=>{wiz=newDraft();wstep=0;wizDone=null;wizErr='';ls.del('wp-draft');current()},
 wprev:()=>{wstep--;wizErr='';saveDraft();current();window.scrollTo(0,0)},
 wnext:()=>{const e=validate();if(e){wizErr=e;current();return}wizErr='';wstep++;saveDraft();current();window.scrollTo(0,0)},
 wsend:async()=>{
  if(sendingPermit)return;
  const g=wiz.general;
  const oldStep=wstep;let err='';
  for(let i=0;i<4;i++){wstep=i;err=validate();if(err)break}
  wstep=oldStep;
  if(err){wizErr=err;toast(err);current();return}
  const desc=Object.assign({},wiz.desc);
  for(const k of wiz.types){
   const notes=(wiz.checks[k]||[]).map((a,i)=>a==='t'?`${i+1}. ${TYPES[k].items[i]} — ${String((wiz.taReasons[k]||{})[i]||'').trim()}`:null).filter(Boolean);
   if(notes.length)desc[k]=(desc[k]||'')+'\n\nALASAN T/A (wajib diverifikasi HSE):\n'+notes.join('\n');
  }
  sendingPermit=true;
  try{
   const r=await api('submit',{general:g,workers:wiz.workers,types:wiz.types,checks:wiz.checks,apd:wiz.apd,desc,jsea:wiz.jsea,hp:($('#hp')||{}).value||''},false);
   wizDone=r.id;wizDone_dept=g.dept;ls.del('wp-draft');wiz=null;wstep=0;window.scrollTo(0,0);current();
  }catch(e){wizErr=e.message;current()}finally{sendingPermit=false}
 },
 addw:()=>{wiz.workers.push({nama:'',unit:'',idn:''});saveDraft();current()},
 addj:()=>{wiz.jsea.push({tahap:'',pic:'',bahaya:'',kendali:'',lingk:'',kendaliLing:''});saveDraft();current()},
 ck:b=>{wiz.checks[b.dataset.k][+b.dataset.i]=b.dataset.v;wiz.taReasons=wiz.taReasons||{};wiz.taReasons[b.dataset.k]=wiz.taReasons[b.dataset.k]||{};if(b.dataset.v!=='t')delete wiz.taReasons[b.dataset.k][+b.dataset.i];saveDraft();current()},
 filter:b=>{filter=b.dataset.k;current()},
 preset:b=>{setPreset(b.dataset.k);current()},
 freset:()=>{Object.keys(fl).forEach(k=>fl[k]='');current()},
 reload:()=>route(),
 monreload:()=>pageMonitoring(),
 resetdraft:()=>{if(!confirm('Hapus draf lokal dan mulai ulang formulir?'))return;ls.del('wp-draft');wiz=newDraft();wstep=0;wizErr='';toast('Draf lokal dihapus.');current()},
 do:b=>doAct(b.dataset.a),
 padclear:()=>{const c=$('#pad');c.getContext('2d').clearRect(0,0,c.width,c.height);padDirty=false;$('#padmsg').textContent=''},
 padsave:async()=>{
  const c=$('#pad');if(!padDirty){$('#padmsg').textContent='Gambar tanda tangan terlebih dahulu.';return}
  const small=document.createElement('canvas');small.width=240;small.height=80;small.getContext('2d').drawImage(c,0,0,240,80);
  try{await api('ttd_save',{ttd:small.toDataURL('image/png')});S.user.hasTtd=true;ls.set('wp-user',JSON.stringify(S.user));toast('Tanda tangan disimpan.');pageProfil()}catch(e){$('#padmsg').textContent=e.message}
 },
 padremove:async()=>{try{await api('ttd_save',{ttd:''});S.user.hasTtd=false;ls.set('wp-user',JSON.stringify(S.user));toast('Tanda tangan dihapus.');pageProfil()}catch(e){toast(e.message)}}
};
const CTX={wiz:()=>wiz,fl:()=>fl,acc:()=>accForm,st:{get q(){return stQ},set q(v){stQ=v}}};
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled){e.preventDefault();const f=ACT[b.dataset.act];if(f)f(b,e)}});
top_.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){const f=ACT[b.dataset.act];if(f)f(b,e)}});
app.addEventListener('input',e=>{
 const t=e.target;if(!t.dataset||!t.dataset.bind)return;
 const c=CTX[t.dataset.ctx];const obj=typeof c==='function'?c():c;if(!obj)return;
 if(t.dataset.ctx==='st'){stQ=t.value;return}
 setPath(obj,t.dataset.bind,t.value);
 if(t.dataset.ctx==='wiz'){
   if(t.dataset.bind==='general.plant'){const g=wiz.general;if(!departmentsForPlant(g.plant).includes(g.dept))g.dept='';rerender()}
   saveDraft();
  }
 if(t.dataset.bind==='role'&&t.dataset.ctx==='acc'&&t.value==='HSE'){accForm.dept='';accForm.plant=''}
 if(t.dataset.bind==='plant'&&t.dataset.ctx==='acc'&&!departmentsForPlant(t.value).includes(accForm.dept))accForm.dept='';
 if(t.dataset.rr)rerender();
});
app.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='mon-plant'){monPlant=t.value;pageMonitoring();return}
 if(t.id==='mon-month'){monMonth=t.value;pageMonitoring();return}
 if(t.id==='mon-status'){monStatus=t.value;pageMonitoring();return}
 if(t.id==='mon-type'){monType=t.value;pageMonitoring();return}
 if(!t.dataset||!t.dataset.chk)return;
 if(t.dataset.chk==='type'){const k=t.dataset.k;if(t.checked){if(!wiz.types.includes(k))wiz.types.push(k);wiz.checks[k]=TYPES[k].items.map(()=>'');wiz.apd[k]=[];wiz.taReasons[k]={}}else{wiz.types=wiz.types.filter(x=>x!==k);delete wiz.taReasons[k];delete wiz.checks[k];delete wiz.apd[k]}saveDraft();current()}
 if(t.dataset.chk==='apd'){const k=t.dataset.k,n=t.dataset.n;const l=wiz.apd[k]=wiz.apd[k]||[];if(t.checked&&!l.includes(n))l.push(n);if(!t.checked)wiz.apd[k]=l.filter(x=>x!==n);saveDraft()}
});
app.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target.dataset.form;
 if(f==='pw')return FORM_pw();
 if(FORM[f])FORM[f](e);
});

/* ===== Mulai ===== */
if(S.token&&!S.user){S.token=''}
route();
</script>
</body>
</html>
